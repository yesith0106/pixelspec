<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>PixelSpec hero</title>
  <!-- Browser-window frame for the README hero clip (1280 x 720). The page inside is app.html. -->
  <style>
    html, body { margin: 0; height: 100%; }
    body { display: grid; place-items: center; background: #fbfbfa; font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .win {
      width: 1136px; height: 648px; display: flex; flex-direction: column; overflow: hidden;
      background: #fff; border: 1px solid #e3e3e1; border-radius: 22px;
      box-shadow: 0 1px 2px rgba(0, 0, 0, .04), 0 24px 60px -20px rgba(0, 0, 0, .12);
    }
    .chrome { height: 64px; flex: none; display: flex; align-items: center; gap: 10px; padding: 0 22px; border-bottom: 1px solid #ececec; }
    .dot { width: 13px; height: 13px; border-radius: 50%; }
    .url {
      flex: 1; height: 38px; margin-left: 18px; display: flex; align-items: center; padding: 0 18px;
      border-radius: 10px; background: #f4f4f3; color: #9b9b98; font-size: 16px; letter-spacing: .01em;
    }
    iframe { flex: 1; width: 100%; border: 0; display: block; }
  </style>
</head>
<body>
  <div class="win">
    <div class="chrome">
      <span class="dot" style="background:#ff5f57"></span>
      <span class="dot" style="background:#febc2e"></span>
      <span class="dot" style="background:#28c840"></span>
      <div class="url">localhost:3000</div>
    </div>
    <iframe src="app.html" title="Example app"></iframe>
  </div>
</body>
</html>
